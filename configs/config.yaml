train:
  model_out: models/matcher.pkl
  negative_ratio: 3
  test_size: 0.2
  random_state: 42
predict:
  model_in: models/matcher.pkl
  top_k: 5
  threshold: 0.7
  out_csv: outputs/mapping_suggestions.csv
  out_json: outputs/mapping_suggestions.json

# ---------- Agent settings (used by src/agent.py) ----------
# These thresholds are read by the TF-IDF verification agent.
# tuned defaults below; change to be stricter/looser as required.
filter_thresholds:
  # primary gate: combined_score >= combined_min will be accepted
  combined_min: 0.70

  # alternate acceptance path: ml_score >= ml_min AND fuzzy_score >= fuzzy_min
  ml_min: 0.40
  fuzzy_min: 0.20

  # semantic TF-IDF similarity threshold (0..1)
  tfidf_sim_threshold: 0.45

  # if top - second < best_vs_second_margin, the match is considered a weak winner
  best_vs_second_margin: 0.08

  # token overlap (Jaccard) threshold used as fallback positive signal
  token_overlap_min: 0.25

  # deduplicate to single best mapping per source column for ETL spec generation
  deduplicate_keep_top: true

# Optional: path to synonyms JSON (agent will load if present)
synonyms_path: "configs/synonyms.json"
